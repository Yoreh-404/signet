[package]
name = "sso-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
csv = "1.3"
data-encoding = "2.6"
diesel = { version = "2.2", default-features = false, features = ["r2d2", "chrono", "serde_json", "uuid"] }
hmac = "0.12"
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
ldap3 = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10"
saml-rs = "=0.3.0"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["compression-full", "cors", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v4"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
default = ["sqlite"]
sqlite = ["diesel/sqlite"]
postgres = ["diesel/postgres"]
mysql = ["diesel/mysql"]
