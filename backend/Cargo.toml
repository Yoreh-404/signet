[package]
name = "sso-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
aes-gcm = "0.11.0"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
csv = "1.3"
data-encoding = "2.6"
diesel = { version = "2.3.12", default-features = false, features = ["r2d2", "chrono", "serde_json", "uuid"] }
ed25519-dalek = "2.2.0"
hmac = "0.12.1"
jsonwebtoken = "9.3.1"
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
ldap3 = "0.12"
md-5 = "0.10.6"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pem"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10.9"
saml-rs = "=0.3.0"
thiserror = "2.0.20"
time = "0.3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tower-http = { version = "0.6.11", features = ["compression-full", "cors", "request-id", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
x509-parser = "0.16.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
default = ["sqlite"]
sqlite = ["diesel/sqlite"]
postgres = ["diesel/postgres"]
mysql = ["diesel/mysql"]
