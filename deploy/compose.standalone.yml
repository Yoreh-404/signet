name: signet-standalone

services:
  signet:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${SIGNET_IMAGE:-signet:standalone}
    environment:
      SSO_CONFIG: /app/config/default.toml
    ports:
      - "${SIGNET_PORT:-8080}:8080"
    volumes:
      - signet-data:/app/data
    restart: unless-stopped

volumes:
  signet-data:
