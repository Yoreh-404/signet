[server]
host = "0.0.0.0"
port = 8080
public_base_url = "http://localhost:8080"
# Trust Forwarded / X-Forwarded-* / Host headers only behind a trusted reverse proxy or tunnel.
# Keep false when you configure the public URL manually in the admin settings page.
trust_proxy_headers = false

[database]
# kind: "sqlite", "postgres", or "mysql".
# Build with the matching cargo feature and enter nix-shell for native libraries.
kind = "sqlite"
url = "data/gpt-sso.sqlite3"
pool_size = 10
run_migrations = true

[performance]
# Low-churn control-plane data stays process-local for a short bounded window;
# the TTL also bounds cross-replica convergence without putting Redis on the
# authentication hot path. Millisecond caches can be set to 0 to disable them.
runtime_settings_cache_millis = 1000
iap_routing_cache_millis = 1000
# Only while another request is actively refreshing an expired routing index,
# peers may briefly reuse the previous control-plane snapshot.
iap_routing_stale_while_refresh_millis = 100
# Collapses parallel asset requests from one browser/session+IAP rule. This is
# a microcache, not an authorization store: 0 disables it; keep the TTL tiny.
iap_authorization_cache_millis = 250
# Only while another request is actively refreshing an expired decision,
# peers may reuse that decision for this additional bounded grace window.
# Set to 0 to make every request wait for the refresh instead.
iap_authorization_stale_while_refresh_millis = 100
iap_authorization_cache_max_entries = 8192
# OIDC discovery derives authorization_details types from registered clients;
# briefly cache that projection rather than loading the full client table.
oidc_metadata_cache_millis = 1000
# Remote private_key_jwt/JAR JWKS honor origin max-age up to this ceiling and
# can be served briefly stale only when the already-validated origin fails.
client_jwks_cache_seconds = 300
client_jwks_max_cache_seconds = 3600
client_jwks_stale_if_error_seconds = 300
client_jwks_max_entries = 1024
# Signet's own /oauth2/jwks endpoint publishes a stable ETag. Keep max-age
# short so signing-key rotations are visible quickly; clients can revalidate
# cheaply with If-None-Match and receive 304.
public_jwks_cache_seconds = 15
signing_key_sync_seconds = 2

[oidc]
issuer = "http://localhost:8080"
authorization_endpoint = "/oauth2/authorize"
token_endpoint = "/oauth2/token"
userinfo_endpoint = "/oauth2/userinfo"
jwks_uri = "/oauth2/jwks"
end_session_endpoint = "/oauth2/logout"
access_token_ttl_seconds = 600
id_token_ttl_seconds = 900
authorization_code_ttl_seconds = 300
refresh_token_ttl_seconds = 2592000
# Built-in browser/resource scopes and cross-project service scopes are
# intentionally explicit. A client/service account must still be granted a
# scope before it can request it; listing a scope here only makes the Signet
# deployment capable of issuing it.
supported_scopes = [
  "openid", "profile", "email", "offline_access", "iap.assert", "scim.read", "scim.write",
  "axon.code.service", "axon.agent.invoke:memory", "axon.hub.read", "axon.hub.submit",
  "axon-next:mcp", "axon-next:models", "axon-next:chat", "axon-next:client-tools",
  "axon-next:vault", "axon-next:plugins", "axon-next:triggers", "axon-next:workflows",
  "axon-next:channels", "axon-next:agents", "axon-next:ui", "axon-next:sessions",
  "anchordocs.service", "ocr.service", "memory.service", "memory.agent.callback",
  "memory.code.index", "memory.code.write", "memory.read", "memory.write", "memory.agent",
  "anchordocs.read", "anchordocs.write",
  "ocr.extract", "ocr.read",
  "axon.mcp", "axon.mcp.session.read", "axon.mcp.session.write",
  "axon.mcp.environment.read", "axon.mcp.environment.write", "axon.mcp.environment.exec",
  "axon.mcp.provider.call", "axon.mcp.skill.read", "axon.mcp.knowledge.read",
  "axon.mcp.code.read", "axon.mcp.operation.read", "axon.mcp.operation.write",
  "billing.read", "billing.reserve", "billing.commit", "billing.release", "billing.refund",
]
# If false, users see a consent page before a new client/scope set is authorized.
skip_consent = false
allow_dynamic_client_registration = false

[discovery]
# Website-managed application trust is configured from deployment secrets. The
# fetch secret is encrypted before persistence; the website signing key is
# pinned as public JWKS. Keep the private-network escape hatch false outside a
# local Compose edge.
sync_interval_seconds = 300
allow_private_networks = false
encryption_key = ""

# Automatic registration is inert until an origin is explicitly listed below.
# It performs machine verification (HTTPS, whitelist, challenge and JWS); no
# human approval is required after the deployment-owned whitelist is present.
[discovery.auto_registration]
enabled = true
startup_scan = true
challenge_ttl_seconds = 300
max_concurrency = 4
# [[discovery.auto_registration.allowlist]]
# id = "axon"
# origin = "https://axon.example.com"
# organization_id = "tenant-organization-id"
# application_ids = ["axon"]
# auto_activate = true

[billing]
enabled = true
default_currency = "CNY"
reservation_ttl_seconds = 900
# Durable provider reconciliation starts after this interval and then runs
# periodically. Instances coordinate through payment_orders leases.
reconcile_interval_seconds = 30
reconcile_batch_size = 32
reconcile_lease_seconds = 120
reconcile_retry_base_seconds = 10
reconcile_retry_max_seconds = 900

[[billing.supported_currencies]]
code = "CNY"
minor_unit = 2

# Payment credentials should be supplied through *_env in production. The
# adapters are disabled until each merchant configuration is complete.
[[billing.providers]]
slug = "epay"
kind = "epay_v1"
enabled = false
gateway_url = "https://pay.example.com/submit.php"
merchant_id = ""
payment_channel = "alipay"
merchant_secret_env = "SIGNET_EPAY_KEY"

[[billing.providers]]
slug = "alipay"
kind = "alipay_page"
enabled = false
gateway_url = "https://openapi.alipay.com/gateway.do"
app_id = ""
private_key_env = "SIGNET_ALIPAY_PRIVATE_KEY_PEM"
alipay_public_key_env = "SIGNET_ALIPAY_PUBLIC_KEY_PEM"

[[billing.providers]]
slug = "wechat"
kind = "wechat_native"
enabled = false
gateway_url = "https://api.mch.weixin.qq.com"
app_id = ""
merchant_id = ""
certificate_serial_no = ""
private_key_env = "SIGNET_WECHAT_PRIVATE_KEY_PEM"
api_v3_key_env = "SIGNET_WECHAT_API_V3_KEY"

# User delegation is narrower than a client's ordinary scope grant.  Every
# RFC 8693 exchange must match one of these actor/target/source rules, and
# every listed scope must also be present in the user's live consent.
[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "axon"
subject_client_id = "axon"
scopes = ["axon.agent.invoke:memory"]

[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "memory-atlas"
subject_client_id = "axon"
scopes = ["memory.code.index", "memory.code.write", "memory.read", "memory.write", "memory.agent"]

[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "anchordocs"
subject_client_id = "axon"
scopes = ["anchordocs.read", "anchordocs.write"]

[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "axon-hub"
subject_client_id = "axon"
scopes = ["axon.hub.read", "axon.hub.submit"]

[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "ocr"
subject_client_id = "axon"
scopes = ["ocr.extract", "ocr.read"]

[[oidc.delegated_allowlist]]
client_id = "memory-atlas-to-axon"
audience = "axon"
scopes = ["axon.agent.invoke:memory"]

[security]
cookie_name = "gpt_sso_session"
cookie_domain = ""
cookie_secure = false
cookie_same_site = "Lax"
# Local-only escape hatch for development when the browser origin cannot be configured.
# Keep false outside a loopback test environment; CSRF tokens remain required for session writes.
disable_csrf_origin_check = false
session_ttl_seconds = 28800
password_min_length = 10
# Optional RS256 private key. If empty, the server generates a key and persists it in the database.
rsa_private_key_pem = ""
# Required to enable TOTP. Supply a deployment-owned base64/base64url 32-byte
# key through this field or SSO_TOTP_ENCRYPTION_KEY; never store it in the DB.
totp_encryption_key = ""
key_id = "dev-key-1"
# SAML IdP signing material. The private key may be left blank to reuse the
# active JWT key, but the matching X.509 certificate is required when SAML is enabled.
saml_private_key_pem = ""
saml_signing_certificate_pem = ""
# ForwardAuth emits a signed, audience-bound assertion in addition to the
# compatibility identity headers. Keep it short-lived for safe edge caching.
iap_assertion_ttl_seconds = 30
admin_api_prefix = "/api/admin"

[registration]
allow_password_registration = true
require_email_verification = false
require_phone_verification = false
allow_external_oidc_registration = true
require_invitation = false
first_user_direct_admin = true
default_user_active = true

[verification.email]
enabled = true
delivery = "dev_log"
code_ttl_seconds = 600
resend_interval_seconds = 60
max_attempts = 5
# delivery = "webhook" sends JSON to webhook_url. Use this for company mail/SMS gateways.
webhook_url = ""
webhook_secret = ""
webhook_timeout_seconds = 5
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_password = ""
smtp_from = ""
smtp_starttls = true
sms_provider = ""
sms_api_key = ""

[verification.phone]
enabled = true
delivery = "dev_log"
code_ttl_seconds = 600
resend_interval_seconds = 60
max_attempts = 5
# delivery = "webhook" sends JSON to webhook_url. delivery = "sms_provider" posts the same JSON to sms_provider with optional Bearer sms_api_key.
webhook_url = ""
webhook_secret = ""
webhook_timeout_seconds = 5
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_password = ""
smtp_from = ""
smtp_starttls = true
sms_provider = ""
sms_api_key = ""

[i18n]
default_locale = "zh-CN"
supported_locales = ["zh-CN", "en-US"]

[[external_oidc_providers]]
slug = "example"
display_name = "Example OIDC"
organization_id = ""
issuer = "https://accounts.example.com"
client_id = ""
client_secret = ""
authorization_endpoint = "https://accounts.example.com/oauth2/authorize"
token_endpoint = "https://accounts.example.com/oauth2/token"
userinfo_endpoint = "https://accounts.example.com/oauth2/userinfo"
redirect_path = "/api/register/oidc/example/callback"
scopes = ["openid", "profile", "email"]
email_domains = []
enabled = false
allow_login = true
allow_registration = true

[cors]
allowed_origins = [
  "http://localhost:5173", "http://127.0.0.1:5173",
  "http://localhost:8080", "http://127.0.0.1:8080",
  "http://localhost:18081", "http://127.0.0.1:18081",
  "http://localhost:18085", "http://127.0.0.1:18085",
]
allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allowed_headers = ["authorization", "content-type", "x-csrf-token"]
allow_credentials = true

[bootstrap.admin]
create_on_startup = false
email = "admin@example.com"
username = "admin"
display_name = "SSO Admin"
password = "ChangeMe123!"

# Signet deploys the application boundary, while Axon publishes the clients,
# protocol adapters, and entitlement catalog at its signed well-known URL.
# No client, provider, protocol, or role is embedded in this deployment
# profile; website-managed details are reconciled from the Axon manifest.
[[bootstrap.applications]]
application_id = "axon"
name = "Axon"
website_url = "https://axon-admin.test.com"
management_mode = "website_managed"
is_active = true
fetch_secret_env = "SIGNET_AXON_DISCOVERY_FETCH_SECRET"
signing_public_jwks_env = "SIGNET_AXON_DISCOVERY_SIGNING_PUBLIC_JWKS"

[[bootstrap.applications]]
application_id = "axon-hub"
name = "Axon Hub"
website_url = "https://hub.test.com"
management_mode = "website_managed"
is_active = true
fetch_secret_env = "SIGNET_AXON_HUB_DISCOVERY_FETCH_SECRET"
signing_public_jwks_env = "SIGNET_AXON_HUB_DISCOVERY_SIGNING_PUBLIC_JWKS"

[[bootstrap.applications]]
application_id = "memory-atlas"
name = "Memory Atlas"
website_url = "https://mem.test.com"
management_mode = "website_managed"
is_active = true
fetch_secret_env = "SIGNET_MEMORY_ATLAS_DISCOVERY_FETCH_SECRET"
signing_public_jwks_env = "SIGNET_MEMORY_ATLAS_DISCOVERY_SIGNING_PUBLIC_JWKS"

[[bootstrap.applications]]
application_id = "anchordocs"
name = "AnchorDocs"
website_url = "https://docs.test.com"
management_mode = "website_managed"
is_active = true
fetch_secret_env = "SIGNET_ANCHORDOCS_DISCOVERY_FETCH_SECRET"
signing_public_jwks_env = "SIGNET_ANCHORDOCS_DISCOVERY_SIGNING_PUBLIC_JWKS"

[[bootstrap.applications]]
application_id = "ocr"
name = "OCR"
website_url = "https://ocr.test.com"
management_mode = "website_managed"
is_active = true
fetch_secret_env = "SIGNET_OCR_DISCOVERY_FETCH_SECRET"
signing_public_jwks_env = "SIGNET_OCR_DISCOVERY_SIGNING_PUBLIC_JWKS"

# Authentication clients, protocol adapters, directory connectors, and role
# catalogs are intentionally not bootstrapped here. Each website publishes
# its signed signet-application/v3 contract; Signet only enrolls the
# application boundary and reconciles that verified snapshot.
