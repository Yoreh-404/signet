[server]
host = "127.0.0.1"
port = 8080
public_base_url = "http://localhost:8080"
# Trust Forwarded / X-Forwarded-* / Host headers only behind a trusted reverse proxy or tunnel.
# Keep false when you configure the public URL manually in the admin settings page.
trust_proxy_headers = false

[database]
# kind: "sqlite", "postgres", or "mysql".
# Build with the matching cargo feature and enter nix-shell for native libraries.
kind = "sqlite"
url = "data/gpt-sso.sqlite3"
pool_size = 10
run_migrations = true

[oidc]
issuer = "http://localhost:8080"
authorization_endpoint = "/oauth2/authorize"
token_endpoint = "/oauth2/token"
userinfo_endpoint = "/oauth2/userinfo"
jwks_uri = "/oauth2/jwks"
end_session_endpoint = "/oauth2/logout"
access_token_ttl_seconds = 600
id_token_ttl_seconds = 900
authorization_code_ttl_seconds = 300
refresh_token_ttl_seconds = 2592000
# Cross-project service scopes are intentionally explicit and still require
# each client/service account to be granted the scope before it can request a
# token. They are listed here so Axon, memory-atlas, and axon-code-service can
# use the same Signet deployment without adding local JWT/HMAC trust roots.
supported_scopes = [
  "openid", "profile", "email", "offline_access", "scim.read", "scim.write",
  "axon.code.service", "axon.agent.invoke:memory", "axon.hub.read", "axon.hub.submit",
  "anchordocs.service", "ocr.service", "memory.service", "memory.agent.callback",
  "memory.code.index", "memory.code.write", "memory.read", "memory.write", "memory.agent",
  "anchordocs.read", "anchordocs.write",
  "ocr.extract", "ocr.read",
]
# If false, users see a consent page before a new client/scope set is authorized.
skip_consent = false
allow_dynamic_client_registration = false

# User delegation is narrower than a client's ordinary scope grant.  Every
# RFC 8693 exchange must match one of these actor/target/source rules, and
# every listed scope must also be present in the user's live consent.
[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "axon"
subject_client_id = "axon"
scopes = ["axon.agent.invoke:memory"]

[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "memory-atlas"
subject_client_id = "axon"
scopes = ["memory.code.index", "memory.code.write", "memory.read", "memory.write", "memory.agent"]

[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "anchordocs"
subject_client_id = "axon"
scopes = ["anchordocs.read", "anchordocs.write"]

[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "axon-hub"
subject_client_id = "axon"
scopes = ["axon.hub.read", "axon.hub.submit"]

[[oidc.delegated_allowlist]]
client_id = "axon"
audience = "ocr"
subject_client_id = "axon"
scopes = ["ocr.extract", "ocr.read"]

[[oidc.delegated_allowlist]]
client_id = "memory-atlas-to-axon"
audience = "axon"
scopes = ["axon.agent.invoke:memory"]

[security]
cookie_name = "gpt_sso_session"
cookie_domain = ""
cookie_secure = false
cookie_same_site = "Lax"
# Local-only escape hatch for development when the browser origin cannot be configured.
# Keep false outside a loopback test environment; CSRF tokens remain required for session writes.
disable_csrf_origin_check = false
session_ttl_seconds = 28800
password_min_length = 10
# Optional RS256 private key. If empty, the server generates a key and persists it in the database.
rsa_private_key_pem = ""
key_id = "dev-key-1"
# SAML IdP signing material. The private key may be left blank to reuse the
# active JWT key, but the matching X.509 certificate is required when SAML is enabled.
saml_private_key_pem = ""
saml_signing_certificate_pem = ""
admin_api_prefix = "/api/admin"

[registration]
allow_password_registration = true
require_email_verification = false
require_phone_verification = false
allow_external_oidc_registration = true
require_invitation = false
first_user_direct_admin = true
default_user_active = true

[verification.email]
enabled = true
delivery = "dev_log"
code_ttl_seconds = 600
resend_interval_seconds = 60
max_attempts = 5
# delivery = "webhook" sends JSON to webhook_url. Use this for company mail/SMS gateways.
webhook_url = ""
webhook_secret = ""
webhook_timeout_seconds = 5
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_password = ""
smtp_from = ""
smtp_starttls = true
sms_provider = ""
sms_api_key = ""

[verification.phone]
enabled = true
delivery = "dev_log"
code_ttl_seconds = 600
resend_interval_seconds = 60
max_attempts = 5
# delivery = "webhook" sends JSON to webhook_url. delivery = "sms_provider" posts the same JSON to sms_provider with optional Bearer sms_api_key.
webhook_url = ""
webhook_secret = ""
webhook_timeout_seconds = 5
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_password = ""
smtp_from = ""
smtp_starttls = true
sms_provider = ""
sms_api_key = ""

[i18n]
default_locale = "zh-CN"
supported_locales = ["zh-CN", "en-US"]

[[external_oidc_providers]]
slug = "example"
display_name = "Example OIDC"
organization_id = ""
issuer = "https://accounts.example.com"
client_id = ""
client_secret = ""
authorization_endpoint = "https://accounts.example.com/oauth2/authorize"
token_endpoint = "https://accounts.example.com/oauth2/token"
userinfo_endpoint = "https://accounts.example.com/oauth2/userinfo"
redirect_path = "/api/register/oidc/example/callback"
scopes = ["openid", "profile", "email"]
email_domains = []
enabled = false
allow_login = true
allow_registration = true

[cors]
allowed_origins = [
  "http://localhost:5173", "http://127.0.0.1:5173",
  "http://localhost:8080", "http://127.0.0.1:8080",
  "http://localhost:18081", "http://127.0.0.1:18081",
  "http://localhost:18085", "http://127.0.0.1:18085",
]
allowed_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allowed_headers = ["authorization", "content-type", "x-csrf-token"]
allow_credentials = true

[bootstrap.admin]
create_on_startup = false
email = "admin@example.com"
username = "admin"
display_name = "SSO Admin"
password = "ChangeMe123!"

[[bootstrap.clients]]
client_id = "demo-web"
client_name = "Demo Web App"
logo_uri = ""
client_secret = "demo-secret-change-me"
redirect_uris = ["http://localhost:3000/callback", "http://localhost:5173/callback"]
post_logout_redirect_uris = ["http://localhost:3000/"]
scopes = ["openid", "profile", "email", "offline_access"]
grant_types = ["authorization_code", "refresh_token", "urn:ietf:params:oauth:grant-type:device_code", "urn:ietf:params:oauth:grant-type:token-exchange"]
response_types = ["code"]
token_endpoint_auth_method = "client_secret_basic"
require_pkce = false

# Cross-project service identities.  These local values make a fresh
# development deployment immediately bootstrap-able; production deployments
# must replace them in a deployment-specific config/secret workflow before
# exposing Signet outside the local network.
[[bootstrap.clients]]
client_id = "memory-atlas-to-axon"
client_name = "Memory Atlas -> Axon Agent Webhook"
client_secret = "local-memory-atlas-to-axon-change-me"
scopes = ["axon.agent.invoke:memory"]
grant_types = ["client_credentials"]
response_types = []
token_endpoint_auth_method = "client_secret_basic"
require_confidential_client = true
service_account_enabled = true
audience = "axon"

