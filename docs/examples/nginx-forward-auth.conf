# Signet ForwardAuth baseline for an existing website that cannot implement OIDC.
#
# Trust boundary assumed by this example:
#   Signet: https://sso.example.com
#   Legacy site: https://legacy.example.com
#   Signet security.cookie_domain / SSO_COOKIE_DOMAIN: .example.com
#   legacy_backend is reachable only from this reverse proxy/private network.
#   Browser cookies are NOT forwarded to legacy_backend by default; explicitly
#   allowlist only application-owned cookies if the legacy app still needs them.
#
# Do NOT use this layout across unrelated top-level domains. Browsers will not
# send the Signet session cookie there. Use an OIDC Authorization Code + PKCE
# edge session for that case instead.

# These maps live in the nginx `http {}` context. Browser document navigations
# may be redirected to login; API/XHR requests should keep a real 401 so JSON
# clients never receive an HTML login flow. Empty Upgrade keeps normal upstream
# HTTP/1.1 connections reusable, while WebSocket handshakes still work.
map $http_accept $signet_html_navigation {
    default      0;
    ~*text/html  1;
}

map $http_upgrade $signet_connection_upgrade {
    default  upgrade;
    ''       '';
}

upstream legacy_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name legacy.example.com;

    # TLS configuration omitted.

    # Internal auth subrequest. The original browser request must never be able
    # to invoke this location directly.
    location = /_signet_forward_auth {
        internal;

        proxy_pass https://sso.example.com/api/iap/forward-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_ssl_server_name on;
        proxy_ssl_name sso.example.com;
        # Nginx does not verify HTTPS proxy certificates unless explicitly
        # enabled. Identity headers from an unverified auth upstream are not a
        # trust boundary. Adjust the CA bundle path for the host distribution.
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host sso.example.com;

        # A shared-parent-domain Signet cookie arrives on the legacy request and
        # is forwarded only to the trusted Signet auth endpoint.
        proxy_set_header Cookie $http_cookie;
        # ForwardAuth is cookie-authenticated. Never let a browser-supplied
        # Authorization credential become an accidental auth input here.
        proxy_set_header Authorization "";

        # Identity headers supplied by the browser are never inputs to Signet.
        # Clear the current compatibility/header contract before the auth
        # subrequest so future application code cannot accidentally treat a
        # spoofed request header as an authenticated principal.
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-User-Id "";
        proxy_set_header X-Auth-Request-Name "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-GPT-SSO-IAP-Application "";
        proxy_set_header X-Signet-Subject "";
        proxy_set_header X-Signet-Email "";
        proxy_set_header X-Signet-Name "";
        proxy_set_header X-Signet-Organization "";
        proxy_set_header X-Signet-Roles "";
        proxy_set_header X-Signet-Permissions "";
        proxy_set_header X-Signet-Assertion "";
        proxy_set_header X-Signet-Assertion-Audience "";
        proxy_set_header X-Signet-Assertion-Expires-In "";

        # Signet derives the protected IAP rule from these trusted proxy values.
        # Use the configured virtual host rather than the raw Host request
        # header so a browser cannot steer Signet's routing decision with a
        # forged host value.
        proxy_set_header X-Original-URL "$scheme://$server_name$request_uri";
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;

        # The signed assertion can be larger than a normal identity header.
        # Keep this bounded but avoid depending on tiny proxy defaults.
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
    }

    location / {
        auth_request /_signet_forward_auth;

        # The 401 response contains a local, validated Signet login path. Turn
        # it into an absolute redirect to the real SSO origin; this preserves
        # the original target without copying session cookies across domains.
        auth_request_set $signet_login $upstream_http_x_auth_request_redirect;
        error_page 401 = @signet_login;

        # Capture ONLY headers produced by the ForwardAuth response. Each
        # proxy_set_header below replaces the browser-supplied value; if the
        # auth response omitted an optional header, Nginx omits it upstream.
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_user_id $upstream_http_x_auth_request_user_id;
        auth_request_set $auth_name $upstream_http_x_auth_request_name;
        auth_request_set $forwarded_user $upstream_http_x_forwarded_user;
        auth_request_set $forwarded_email $upstream_http_x_forwarded_email;
        auth_request_set $iap_application $upstream_http_x_gpt_sso_iap_application;
        auth_request_set $signet_subject $upstream_http_x_signet_subject;
        auth_request_set $signet_email $upstream_http_x_signet_email;
        auth_request_set $signet_name $upstream_http_x_signet_name;
        auth_request_set $signet_organization $upstream_http_x_signet_organization;
        auth_request_set $signet_roles $upstream_http_x_signet_roles;
        auth_request_set $signet_permissions $upstream_http_x_signet_permissions;
        auth_request_set $signet_assertion $upstream_http_x_signet_assertion;
        auth_request_set $signet_assertion_audience $upstream_http_x_signet_assertion_audience;
        auth_request_set $signet_assertion_expires_in $upstream_http_x_signet_assertion_expires_in;

        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-User-Id $auth_user_id;
        proxy_set_header X-Auth-Request-Name $auth_name;
        proxy_set_header X-Forwarded-User $forwarded_user;
        proxy_set_header X-Forwarded-Email $forwarded_email;
        proxy_set_header X-GPT-SSO-IAP-Application $iap_application;
        proxy_set_header X-Signet-Subject $signet_subject;
        proxy_set_header X-Signet-Email $signet_email;
        proxy_set_header X-Signet-Name $signet_name;
        proxy_set_header X-Signet-Organization $signet_organization;
        proxy_set_header X-Signet-Roles $signet_roles;
        proxy_set_header X-Signet-Permissions $signet_permissions;
        proxy_set_header X-Signet-Assertion $signet_assertion;
        # Informational only. A legacy upstream that verifies the JWT must
        # compare `aud` with an expected immutable rule audience from its own
        # deployment configuration, never with this request header itself.
        proxy_set_header X-Signet-Assertion-Audience $signet_assertion_audience;
        proxy_set_header X-Signet-Assertion-Expires-In $signet_assertion_expires_in;

        # A parent-domain Signet cookie is a bearer credential and must not be
        # exposed to an application merely because the browser sent it to this
        # sibling host. The safe baseline is to forward no browser cookies.
        # If the legacy application still needs its own cookies, replace this
        # with an explicit application-cookie allowlist; NEVER use
        # `proxy_set_header Cookie $http_cookie` on the business upstream.
        # Example for a single application-owned session cookie:
        #   proxy_set_header Cookie "legacy_session=$cookie_legacy_session";
        proxy_set_header Cookie "";
        # The compatibility boundary is the Signet identity projection above,
        # not an arbitrary browser bearer credential.
        proxy_set_header Authorization "";

        # Normal reverse-proxy context for the application itself.
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not append an arbitrary browser-supplied X-Forwarded-For value.
        # If Nginx itself sits behind a trusted LB, configure the real_ip
        # module for that LB and $remote_addr will still be the canonical
        # client address here.
        proxy_set_header X-Forwarded-For $remote_addr;

        # auth_request runs once on the HTTP upgrade handshake; after Signet
        # allows it, the upgraded connection belongs to the legacy backend.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $signet_connection_upgrade;

        proxy_http_version 1.1;
        proxy_pass http://legacy_backend;
    }

    location @signet_login {
        # Never turn an unauthenticated state-changing request into a GET by
        # following a 302 login flow. That would silently discard the request
        # body and can confuse legacy form/API semantics. GET/HEAD navigations
        # may redirect; callers must retry other methods after authentication.
        if ($request_method !~ ^(GET|HEAD)$) { return 401; }
        if ($signet_html_navigation = 0) { return 401; }

        # Signet creates this value from a validated IAP target and returns a
        # local path such as /api/iap/start?return_to=.... Prefixing the fixed
        # SSO origin prevents an arbitrary upstream redirect target.
        return 302 https://sso.example.com$signet_login;
    }
}

# Server-Sent Events need their usual application-specific Nginx tuning (most
# importantly `proxy_buffering off`) in the SSE location. That is independent
# of Signet; the auth_request itself remains a short header-only subrequest.
