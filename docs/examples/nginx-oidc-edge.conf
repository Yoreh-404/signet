# Signet OIDC edge baseline for a legacy website on an unrelated top-level domain.
#
# Trust boundary assumed by this example:
#   Signet: https://sso.example.com
#   Legacy site: https://legacy.example.net
#   Local edge sidecar: http://127.0.0.1:4180
#   legacy_backend is reachable only from this reverse proxy/private network.
#
# The production sidecar is the `signet-edge` Rust binary (`nix build .#edge`
# or the `edgeImage` Nix package). scripts/oidc-edge-reference.mjs implements
# the same boundary as a readable Node reference. The sidecar owns only the
# browser/OIDC session and calls Signet /api/iap/bearer-auth. It does NOT proxy
# business traffic and the Signet access token is never forwarded to the legacy
# upstream.

# These maps live in the nginx `http {}` context. Only browser document
# navigations are redirected into OIDC; API/XHR callers retain a normal 401.
# WebSocket Upgrade is forwarded only on the already-authorized business
# request, never on the auth subrequest.
map $http_accept $signet_html_navigation {
    default      0;
    ~*text/html  1;
}

map $http_upgrade $signet_connection_upgrade {
    default  upgrade;
    ''       '';
}

upstream signet_edge {
    server 127.0.0.1:4180;
    keepalive 32;
}

upstream legacy_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name legacy.example.net;

    # TLS configuration omitted.

    # The edge owns this reserved local namespace. These endpoints are public
    # browser endpoints and therefore MUST NOT themselves be behind auth_request.
    location = /_signet/start {
        proxy_pass http://signet_edge/_signet/start$is_args$args;
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /_signet/callback {
        proxy_pass http://signet_edge/_signet/callback$is_args$args;
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /_signet/logout {
        proxy_pass http://signet_edge/_signet/logout$is_args$args;
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Internal auth subrequest. Browser-supplied identity headers are explicitly
    # cleared before the request reaches the edge. Only the host-only edge
    # session cookie is an authentication input.
    location = /_signet_auth {
        internal;
        proxy_pass http://signet_edge/_signet/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        # The edge authenticates this subrequest only with its sealed host-only
        # session cookie. Never accept a browser bearer credential here.
        proxy_set_header Authorization "";

        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-User-Id "";
        proxy_set_header X-Auth-Request-Name "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-GPT-SSO-IAP-Application "";
        proxy_set_header X-Signet-Subject "";
        proxy_set_header X-Signet-Email "";
        proxy_set_header X-Signet-Name "";
        proxy_set_header X-Signet-Organization "";
        proxy_set_header X-Signet-Roles "";
        proxy_set_header X-Signet-Permissions "";
        proxy_set_header X-Signet-Assertion "";
        proxy_set_header X-Signet-Assertion-Audience "";
        proxy_set_header X-Signet-Assertion-Expires-In "";

        # The edge refuses targets outside SIGNET_EDGE_PUBLIC_ORIGIN. Use the
        # configured virtual host rather than a browser-controlled Host header.
        proxy_set_header X-Original-URL "$scheme://$server_name$request_uri";
        proxy_set_header X-Original-Uri $request_uri;
        proxy_set_header X-Original-Method $request_method;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
    }

    location / {
        auth_request /_signet_auth;

        auth_request_set $edge_login $upstream_http_x_auth_request_redirect;
        auth_request_set $edge_set_cookie $upstream_http_set_cookie;
        error_page 401 = @signet_edge_login;
        add_header Set-Cookie $edge_set_cookie always;

        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_user_id $upstream_http_x_auth_request_user_id;
        auth_request_set $auth_name $upstream_http_x_auth_request_name;
        auth_request_set $forwarded_user $upstream_http_x_forwarded_user;
        auth_request_set $forwarded_email $upstream_http_x_forwarded_email;
        auth_request_set $iap_application $upstream_http_x_gpt_sso_iap_application;
        auth_request_set $signet_subject $upstream_http_x_signet_subject;
        auth_request_set $signet_email $upstream_http_x_signet_email;
        auth_request_set $signet_name $upstream_http_x_signet_name;
        auth_request_set $signet_organization $upstream_http_x_signet_organization;
        auth_request_set $signet_roles $upstream_http_x_signet_roles;
        auth_request_set $signet_permissions $upstream_http_x_signet_permissions;
        auth_request_set $signet_assertion $upstream_http_x_signet_assertion;
        auth_request_set $signet_assertion_audience $upstream_http_x_signet_assertion_audience;
        auth_request_set $signet_assertion_expires_in $upstream_http_x_signet_assertion_expires_in;

        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-User-Id $auth_user_id;
        proxy_set_header X-Auth-Request-Name $auth_name;
        proxy_set_header X-Forwarded-User $forwarded_user;
        proxy_set_header X-Forwarded-Email $forwarded_email;
        proxy_set_header X-GPT-SSO-IAP-Application $iap_application;
        proxy_set_header X-Signet-Subject $signet_subject;
        proxy_set_header X-Signet-Email $signet_email;
        proxy_set_header X-Signet-Name $signet_name;
        proxy_set_header X-Signet-Organization $signet_organization;
        proxy_set_header X-Signet-Roles $signet_roles;
        proxy_set_header X-Signet-Permissions $signet_permissions;
        proxy_set_header X-Signet-Assertion $signet_assertion;
        proxy_set_header X-Signet-Assertion-Audience $signet_assertion_audience;
        proxy_set_header X-Signet-Assertion-Expires-In $signet_assertion_expires_in;

        # Never forward the edge's __Host-signet_edge bearer cookie to the
        # legacy application. Safe baseline: no browser cookies at all. If the
        # app needs its own session, allowlist only that cookie by name.
        #   proxy_set_header Cookie "legacy_session=$cookie_legacy_session";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $signet_connection_upgrade;
        proxy_http_version 1.1;
        proxy_pass http://legacy_backend;
    }

    location @signet_edge_login {
        # Preserve non-idempotent request semantics. Redirecting POST/PUT/etc.
        # through an OIDC login would normally become GET and lose the body.
        # Keep those requests fail-closed with 401; the caller can retry after
        # an authenticated GET/navigation establishes the edge session.
        if ($request_method !~ ^(GET|HEAD)$) { return 401; }
        if ($signet_html_navigation = 0) { return 401; }

        # The edge only emits a local /_signet/start path derived from the
        # already-validated same-origin target. Prefix the fixed site origin so
        # a compromised/misconfigured upstream cannot create an open redirect.
        # Preserve the auth subrequest's cookie deletion on the error_page
        # redirect so an expired/corrupt edge session is actually discarded.
        add_header Set-Cookie $edge_set_cookie always;
        return 302 https://legacy.example.net$edge_login;
    }
}

# For Server-Sent Events, use the normal dedicated Nginx SSE location with
# `proxy_buffering off`; Signet auth_request remains header-only and does not
# buffer the event stream itself.
