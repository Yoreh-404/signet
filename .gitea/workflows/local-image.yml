name: Build local Docker image

on:
  workflow_dispatch:

jobs:
  build-local:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image into the runner Docker daemon
        run: |
          set -euo pipefail
          docker build --pull=false -t signet:local .
          docker image inspect signet:local >/dev/null
