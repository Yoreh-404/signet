name: Deploy Signet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensponge-deploy-signet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux-arm64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OCI image with local Nix
        run: |
          set -euo pipefail
          image_path="$(nix build --no-link --print-build-logs --print-out-paths .#image)"
          docker load < "$image_path"
          test "$(docker image inspect signet:local --format '{{.Architecture}}/{{.Os}}')" = arm64/linux

      - name: Deploy updated service
        run: sudo -n /run/current-system/sw/bin/opensponge-deploy signet

      - name: Verify service readiness
        run: curl --fail --silent --show-error http://127.0.0.1:18080/api/health/ready
