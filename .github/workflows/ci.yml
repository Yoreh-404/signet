name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: [self-hosted, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --fund=false
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: node --check scripts/browser-smoke.mjs

  backend:
    runs-on: [self-hosted, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install native database and TLS libraries
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev libpq-dev libsqlite3-dev libssl-dev pkg-config
      - run: npm ci --no-audit --fund=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          SSO_SKIP_FRONTEND_BUILD: "1"
      - run: cargo test --workspace --all-features
        env:
          SSO_SKIP_FRONTEND_BUILD: "1"
