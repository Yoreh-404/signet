name: Publish Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/signet

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          image="$(printf '%s' "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          short_revision="${REVISION::12}"
          docker_tag="$(printf '%s' "$REF_NAME" | tr -c '[:alnum:]_.-' '-')"

          {
            echo "registry=$REGISTRY"
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:sha-$short_revision"
            if [ "$REF_TYPE" = "tag" ]; then
              echo "$image:$docker_tag"
              version_tag="${docker_tag#v}"
              if [ -n "$version_tag" ]; then
                echo "$image:$version_tag"
              fi
            else
              echo "$image:$docker_tag"
              if [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
                echo "$image:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
