name: Publish Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/signet

jobs:
  publish:
    runs-on: [self-hosted, arm-nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          image="$(printf '%s' "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          short_revision="${REVISION::12}"
          docker_tag="$(printf '%s' "$REF_NAME" | tr -c '[:alnum:]_.-' '-')"

          {
            echo "registry=$REGISTRY"
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:sha-$short_revision"
            if [ "$REF_TYPE" = "tag" ]; then
              echo "$image:$docker_tag"
              version_tag="${docker_tag#v}"
              if [ -n "$version_tag" ]; then
                echo "$image:$version_tag"
              fi
            else
              echo "$image:$docker_tag"
              if [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
                echo "$image:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI image with local Nix
        run: |
          set -euo pipefail
          image_path="$(nix build --no-link --print-build-logs --print-out-paths .#image)"
          docker load < "$image_path"
          test "$(docker image inspect signet:local --format '{{.Architecture}}/{{.Os}}')" = arm64/linux

      - name: Push Nix-built image
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag signet:local "$tag"
            docker push "$tag"
          done <<< "$TAGS"
